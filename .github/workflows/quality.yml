name: Quality and supply chain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  infra:
    needs: [backend, lambda-artifact]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: Install the locked infrastructure graph
        run: npm --prefix infra ci
      - uses: actions/download-artifact@v4
        with:
          name: backend-lambda-python314-x86-64
          path: artifacts/lambda
      - uses: actions/download-artifact@v4
        with:
          name: backend-supply-chain-3.14
          path: .
      - name: Typecheck and test topology and operational guardrails
        run: |
          npm --prefix infra run typecheck
          npm --prefix infra test
      - name: Synthesize both environments locally
        run: |
          npm --prefix infra run synth:staging
          npm --prefix infra run synth:production
      - name: Verify real artifact offline synthesis and DynamoDB parity
        run: |
          npm --prefix infra run test:artifact
          npm --prefix infra run test:schema-parity -- --schema ../artifacts/hireflux-dynamodb-schema.json

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install the locked backend graph
        run: uv sync --project backend --python ${{ matrix.python }} --extra dev --locked
      - name: Validate lock and installed dependencies
        run: |
          uv lock --project backend --python ${{ matrix.python }} --check
          uv pip check --python backend/.venv/bin/python
      - name: Ruff
        run: |
          uv run --project backend ruff check backend
          uv run --project backend ruff format --check backend
      - name: Mypy
        run: uv run --project backend mypy backend/src
      - name: Pytest
        run: uv run --project backend pytest backend
      - name: Export the locked runtime graph for auditing
        run: |
          mkdir -p sbom
          uv export --project backend --locked --no-dev --no-emit-project --format requirements.txt --output-file backend/.audit-requirements.txt
      - name: Audit locked Python dependencies
        run: >-
          uvx --from pip-audit==2.10.1 pip-audit --require-hashes --disable-pip
          --progress-spinner=off --format=json
          --output=sbom/hireflux-backend-vulnerability-audit.json
          --requirement backend/.audit-requirements.txt
      - name: Generate backend CycloneDX SBOM
        run: uv run --project backend python backend/scripts/generate_sbom.py
      - name: Generate OpenAPI contract
        run: uv run --project backend python backend/scripts/generate_openapi.py
      - name: Export the canonical DynamoDB schema for infrastructure parity
        if: matrix.python == '3.14'
        run: |
          uv run --project backend python backend/scripts/export_dynamodb_schema.py --output artifacts/hireflux-dynamodb-schema.json
      - name: Upload backend security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-supply-chain-${{ matrix.python }}
          path: |
            sbom/hireflux-backend.cdx.json
            sbom/hireflux-backend-vulnerability-audit.json
            artifacts/hireflux-openapi.json
            artifacts/hireflux-dynamodb-schema.json
          if-no-files-found: error

  lambda-artifact:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - name: Build twice from locked Linux wheels
        run: python backend/scripts/build_lambda_artifact.py --verify-reproducible
      - name: Test the ZIP in the isolated Lambda runtime
        run: python backend/scripts/validate_lambda_artifact.py
      - name: Upload local packaging evidence
        uses: actions/upload-artifact@v4
        with:
          name: backend-lambda-python314-x86-64
          path: artifacts/lambda/
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the locked frontend graph
        run: npm --prefix frontend ci
      - name: Lint, typecheck, and test
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck
          npm --prefix frontend run test
          npm --prefix frontend run test:hosting-headers
          npm --prefix frontend run test:hosting-build
      - name: Build
        env:
          VITE_API_BASE_URL: https://phase3e-example.execute-api.us-east-1.amazonaws.com
          VITE_PUBLIC_SITE_URL: https://main.phase3e-example.amplifyapp.com
          VITE_WORKSPACE_MODE: demo
        run: npm --prefix frontend run build
      - name: Verify deployment-style static artifacts
        env:
          VITE_API_BASE_URL: https://phase3e-example.execute-api.us-east-1.amazonaws.com
          VITE_PUBLIC_SITE_URL: https://main.phase3e-example.amplifyapp.com
          VITE_WORKSPACE_MODE: demo
        run: npm --prefix frontend run verify:hosting-build
      - name: Audit frontend dependencies
        run: npm --prefix frontend audit --audit-level=high
      - name: Generate frontend CycloneDX SBOM
        run: |
          mkdir -p sbom
          npm --prefix frontend sbom --package-lock-only --sbom-format cyclonedx --sbom-type application > sbom/hireflux-frontend.cdx.json
      - name: Upload frontend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: frontend-supply-chain
          path: sbom/hireflux-frontend.cdx.json
          if-no-files-found: error
