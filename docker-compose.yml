services:
  dynamodb-local:
    image: amazon/dynamodb-local:3.3.0
    # The official image runs as a non-root user, while a new Docker named
    # volume is root-owned. Root is limited to this local, loopback-only
    # container so SQLite can initialize the persistent volume on Windows.
    user: root
    working_dir: /home/dynamodblocal
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath ./data
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - dynamodb-local-data:/home/dynamodblocal/data

volumes:
  dynamodb-local-data:
